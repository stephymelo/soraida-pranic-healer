<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 124" width="120" height="124" role="img" aria-label="Soraida Henao — cristal y chakra del corazón">
  <defs>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#FBE7A0" stop-opacity=".85"/>
      <stop offset="55%" stop-color="#F4CF5E" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#F4CF5E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBE7A6"/>
      <stop offset="100%" stop-color="#E9C25E"/>
    </linearGradient>
  </defs>

  <!-- soft aura -->
  <circle cx="60" cy="60" r="58" fill="url(#glow)"/>

  <!-- heart-chakra 12-petal lotus ring -->
  <g fill="url(#petal)" stroke="#D9B15E" stroke-width=".6" opacity=".9">
    <g id="ring">
      <path d="M60 8 Q55.5 22 60 33 Q64.5 22 60 8Z"/>
    </g>
    <use href="#ring" transform="rotate(30 60 62)"/>
    <use href="#ring" transform="rotate(60 60 62)"/>
    <use href="#ring" transform="rotate(90 60 62)"/>
    <use href="#ring" transform="rotate(120 60 62)"/>
    <use href="#ring" transform="rotate(150 60 62)"/>
    <use href="#ring" transform="rotate(180 60 62)"/>
    <use href="#ring" transform="rotate(210 60 62)"/>
    <use href="#ring" transform="rotate(240 60 62)"/>
    <use href="#ring" transform="rotate(270 60 62)"/>
    <use href="#ring" transform="rotate(300 60 62)"/>
    <use href="#ring" transform="rotate(330 60 62)"/>
  </g>

  <!-- faceted crystal heart -->
  <g transform="translate(60 64) scale(.60) translate(-50 -52)">
    <!-- facets (crystal cut) -->
    <g stroke="#B58326" stroke-width=".5" stroke-opacity=".4" stroke-linejoin="round">
      <polygon points="30,15 50,30 70,15" fill="#F3C63E"/>
      <polygon points="50,30 30,15 13,40" fill="#FBE384"/>
      <polygon points="50,30 70,15 87,40" fill="#F1C240"/>
      <polygon points="50,30 13,40 50,55" fill="#F7D257"/>
      <polygon points="50,30 87,40 50,55" fill="#E3AC30"/>
      <polygon points="13,40 27,63 50,55" fill="#E8B637"/>
      <polygon points="87,40 73,63 50,55" fill="#CE9021"/>
      <polygon points="27,63 50,90 50,55" fill="#D9A22A"/>
      <polygon points="73,63 50,90 50,55" fill="#BE7C1A"/>
    </g>
    <!-- specular highlight -->
    <polygon points="34,20 42,27 29,29" fill="#FFFDF3" opacity=".5"/>
    <!-- Anahata six-pointed star (heart chakra yantra) -->
    <g fill="#FFF8E1" fill-opacity=".46" stroke="#FFFBEE" stroke-opacity=".65" stroke-width=".9">
      <polygon points="50,38 37.5,59 62.5,59"/>
      <polygon points="50,68 37.5,47 62.5,47"/>
    </g>
    <!-- crisp silhouette -->
    <polygon points="50,30 30,15 13,40 27,63 50,90 73,63 87,40 70,15" fill="none" stroke="#94600E" stroke-width="1.7" stroke-linejoin="round"/>
  </g>
</svg>
