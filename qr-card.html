<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Casa Del Alma · Escanéame</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..500;1,9..144,300..500&family=Marcellus&family=Mulish:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root{--ivory:#F4EEE4;--paper:#FBF7F0;--sage:#6D7A61;--clay:#A06E52;--ink:#39342C;--muted:#6E6559;--blush:#E6C9BB}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Mulish",sans-serif;background:
    radial-gradient(120% 90% at 20% 0%,#EFE4D6,transparent 60%),
    radial-gradient(120% 90% at 90% 100%,#E8DCE6,transparent 55%),var(--ivory);
    color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:2.5rem 1.2rem}
  .card{width:min(420px,100%);background:var(--paper);border-radius:30px;padding:3rem 2.4rem 2.6rem;
    box-shadow:0 40px 90px -40px rgba(57,52,44,.5);text-align:center;position:relative;overflow:hidden;border:1px solid rgba(57,52,44,.08)}
  .card::before{content:"";position:absolute;top:-70px;right:-70px;width:180px;height:180px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,var(--blush),transparent 70%);opacity:.7}
  .mark{width:70px;height:72px;margin:0 auto .4rem;position:relative;filter:drop-shadow(0 8px 16px rgba(148,96,14,.28))}
  .eyebrow{font-family:"Marcellus",serif;text-transform:uppercase;letter-spacing:.34em;font-size:.66rem;color:var(--clay);position:relative}
  h1{font-family:"Fraunces",serif;font-weight:300;font-size:2.4rem;line-height:1.1;margin:.5rem 0 .3rem;position:relative}
  h1 em{font-style:italic;color:var(--sage)}
  .slogan{font-family:"Fraunces",serif;font-style:italic;color:var(--sage);font-size:1.05rem;margin:.2rem auto .1rem;position:relative}
  .sub{color:var(--muted);font-size:.95rem;font-weight:300;max-width:22em;margin:.5rem auto 0;position:relative}
  .qr{position:relative;margin:2rem auto 1.4rem;width:230px;height:230px;padding:14px;background:var(--ivory);
    border-radius:22px;box-shadow:inset 0 0 0 1px rgba(57,52,44,.1)}
  .qr img{width:100%;height:100%;display:block}
  .scan{font-family:"Marcellus",serif;letter-spacing:.28em;text-transform:uppercase;font-size:.72rem;color:var(--sage);position:relative}
  .rule{width:46px;height:1px;background:rgba(57,52,44,.25);margin:1.3rem auto .9rem}
  .url{font-size:.82rem;color:var(--muted);word-break:break-all;position:relative}
  .foot{font-family:"Marcellus",serif;letter-spacing:.16em;text-transform:uppercase;font-size:.6rem;color:var(--clay);margin-top:.5rem;position:relative}
  @media print{body{background:#fff;padding:0}.card{box-shadow:none;border:1px solid #ddd}}
</style>
</head>
<body>
  <div class="card">
    <img class="mark" src="./logo.svg" alt="Casa Del Alma" />
    <p class="eyebrow">Sanación Pránica · Reiki · Meditación</p>
    <h1>Casa Del <em>Alma</em></h1>
    <p class="slogan">Un lugar donde el alma recuerde su origen.</p>
    <p class="sub">Un espacio de bienestar, armonía y transformación interior.</p>
    <div class="qr"><img src="./qr-soraida.png" alt="Código QR a la página de Casa Del Alma"></div>
    <p class="scan">Escanéame</p>
    <div class="rule"></div>
    <p class="url">soraida-business-card.vercel.app</p>
    <p class="foot">Bienestar &amp; Sanación</p>
  </div>
</body>
</html>
